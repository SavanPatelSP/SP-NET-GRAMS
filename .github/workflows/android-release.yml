name: Android Release

on:
  push:
    branches:
      - phase7-store
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleAfatDebug

      - name: Find APK
        run: |
          find . -name "*.apk"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_BETA }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          testers: savanpatelssp@gmail.com
          file: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          releaseNotes: |
            Automated beta build from GitHub Actions.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
            TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
            TMessagesProj_AppHuawei/build/outputs/apk/afat/debug/app-huawei.apk
